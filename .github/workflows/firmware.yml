# Builds the firmware on every push and pull request.
#  - push to main  -> publishes the web flasher (GitHub Pages) with the new build
#  - tag v*        -> also creates a GitHub Release with the flash images attached
# One-time setup: Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Firmware

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # tags, for git describe

      - name: Version
        id: ver
        run: |
          v=$(git describe --tags --always)
          echo "$v" > version.txt   # ESP-IDF uses version.txt as the app version (shown in logs + settings page)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Firmware version: $v"

      - name: Build (ESP-IDF v5.4.2)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.2
          target: esp32s3
          path: "."
          command: idf.py build

      - name: Assemble web flasher site
        run: |
          sudo chown -R "$(id -u)" build
          python3 tools/make_flasher_site.py --build build --out _site --version "${{ steps.ver.outputs.version }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Release files
        run: |
          pip install --quiet "esptool>=4.8,<5"
          mkdir -p dist
          v="${{ steps.ver.outputs.version }}"
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin dist/
          cp build/weather_amoled.bin "dist/weather_amoled-$v.bin"
          # Full image for a first install with esptool (flash at 0x0). Overwrites saved settings.
          cd build && python3 -m esptool --chip esp32s3 merge_bin -o "../dist/weather_amoled-$v-full.bin" @flash_args
          cd .. && ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ steps.ver.outputs.version }}
          path: dist/

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  pages:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ needs.build.outputs.version }}
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Install from the browser: https://themonkeyz.github.io/esp32-s3-weather/

            Or with esptool, first install (erases saved settings):
            `esptool.py --chip esp32s3 write_flash 0x0 weather_amoled-${{ needs.build.outputs.version }}-full.bin`

            Update keeping settings:
            `esptool.py --chip esp32s3 write_flash 0x0 bootloader.bin 0x8000 partition-table.bin 0x10000 weather_amoled-${{ needs.build.outputs.version }}.bin`
