<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather display</title>
<style>
:root{--bg:#0f1115;--card:#1a1d23;--line:#2a2f37;--text:#eef1f5;--dim:#8b95a1;--acc:#4f9dff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,sans-serif;padding:16px;max-width:460px;margin:auto}
h1{font-size:20px;margin:4px 0 16px}h2{font-size:15px;color:var(--dim);font-weight:600;margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
label{display:block;font-size:13px;color:var(--dim);margin:10px 0 4px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--text);font-size:16px}
button{width:100%;padding:12px;border:0;border-radius:10px;font-size:16px;font-weight:600;margin-top:12px;background:var(--acc);color:#fff}
button.sec{background:#2a2f37}.row{display:flex;gap:10px}.row>div{flex:1}
.cur{font-size:18px;font-weight:600}
#nets div{display:flex;justify-content:space-between;align-items:center}#nets .sig{color:var(--dim);font-size:14px;white-space:nowrap;margin-left:10px}
#nets div.sel{background:#1f3350;border-radius:8px}.muted{color:var(--dim);font-size:13px}
#nets div,#results div{padding:10px;border-bottom:1px solid var(--line);cursor:pointer}#nets div:active,#results div:active{background:#232830}

details.tip{margin:10px 0 2px;font-size:14px;color:var(--dim)}details.tip summary{cursor:pointer;color:var(--accent)}
details.tip ol{margin:6px 0 0;padding-left:20px}details.tip li{margin:4px 0}
.pw{position:relative}.pw input{padding-right:76px}
button.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:auto;margin:0;padding:6px 12px;font-size:14px;background:#2a2f37;border-radius:8px}
.meter{position:relative;height:14px;background:#0c0e12;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin:8px 0 4px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:var(--acc);transition:width .3s}
.meter .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffb347}
.small{height:6px;margin-top:4px}.small .fill{background:#6fd08c}
.st{display:inline-block;padding:2px 10px;border-radius:10px;font-size:13px;font-weight:600;background:#2a2f37}
.st.active{background:#1f4d2e;color:#8ff0a4}.st.dim{background:#4a3d14;color:#ffd479}.st.off{background:#3a1f1f;color:#ff9a9a}
select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#0c0e12;color:var(--text);font-size:16px}
.dur{display:flex;gap:6px}.dur input{flex:1;min-width:0}.dur select{width:78px;padding:11px 6px}
.chk{display:flex;align-items:center;gap:10px;margin-top:10px}.chk input{width:22px;height:22px}
#places .pl{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
#places .pl:active{background:#232830}#places .pn{flex:1;min-width:0}
#places .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#places button{width:auto;margin:0;padding:7px 12px;font-size:14px}
#places .on{color:var(--acc);font-size:13px;font-weight:600;white-space:nowrap}#places .chev{color:var(--dim);font-size:20px}
#edTitle{font-size:18px;font-weight:600;margin-bottom:4px}
#map{height:260px;border-radius:12px;margin-top:10px;border:1px solid var(--line);background:#0c0e12}
button.danger{background:#3a1f1f;color:#ff9a9a}
details.coords{margin-top:10px;font-size:14px;color:var(--dim)}details.coords summary{cursor:pointer}
#msg{min-height:20px;margin-top:10px;font-size:14px}.ok{color:#6fd08c}.err{color:#ff7a7a}
</style></head><body>
<h1 data-i18n="title">Weather display</h1>

<div class="card" id="locCard">
  <h2 data-i18n="places">Places</h2>
  <div id="placeList">
    <div class="muted" data-i18n="placesHelp"></div>
    <div id="places"></div>
    <button class="sec" id="addPlace" data-i18n="addPlace"></button>
  </div>
  <div id="editor" style="display:none">
    <div id="edTitle"></div>
    <label for="name" data-i18n="nameLabel"></label>
    <input id="name" maxlength="40" data-i18n-ph="namePh">
    <label for="q" data-i18n="findCity"></label>
    <input id="q" data-i18n-ph="cityPh" autocomplete="off">
    <div id="results"></div>
    <div id="map"></div>
    <div class="muted" id="mapNote" style="margin-top:6px"></div>
    <button class="sec" id="gps" data-i18n="gps"></button>
    <div class="muted" id="gpsNote" style="display:none;margin-top:8px"><span data-i18n="gpsNote1"></span><a
      id="secureLink" style="color:var(--acc)" href="#"></a><span data-i18n="gpsNote2"></span></div>
    <details class="coords" id="coords"><summary data-i18n="coords"></summary>
      <div class="row">
        <div><label for="lat" data-i18n="lat"></label><input id="lat" inputmode="decimal"></div>
        <div><label for="lon" data-i18n="lon"></label><input id="lon" inputmode="decimal"></div>
      </div>
    </details>
    <div class="row">
      <div><button class="sec" id="cancelEd" data-i18n="cancel"></button></div>
      <div><button id="saveLoc" data-i18n="save"></button></div>
    </div>
    <button class="danger" id="delPlace" data-i18n="delPlace"></button>
  </div>
  <div id="msg"></div>
</div>

<div class="card" id="unitCard">
  <h2 data-i18n="units"></h2>
  <label for="uLang" data-i18n="language"></label>
  <select id="uLang"><option value="en">English</option><option value="fr">Français</option></select>
  <div class="row">
    <div><label for="uTemp" data-i18n="temperature"></label>
      <select id="uTemp"><option value="c">°C</option><option value="f">°F</option></select></div>
    <div><label for="uWind" data-i18n="wind"></label>
      <select id="uWind"><option value="kmh">km/h</option><option value="mph">mph</option><option value="ms">m/s</option></select></div>
  </div>
  <label for="uClock" data-i18n="clock"></label>
  <select id="uClock"><option value="24" data-i18n="clock24"></option><option value="12" data-i18n="clock12"></option></select>
  <div id="umsg" class="muted" style="margin-top:8px" data-i18n="unitsNote"></div>
</div>

<div class="card" id="presCard">
  <h2 data-i18n="presTitle"></h2>
  <div><span class="st" id="pState">…</span> <span class="muted" id="pBright"></span></div>
  <div class="meter" id="pMeter"><div class="fill" id="pFill"></div><div class="mark" id="pMark"></div></div>
  <div class="muted" id="pLevel">…</div>
  <div class="meter small"><div class="fill" id="pWake"></div></div>
  <div class="muted" id="pWakeTxt"></div>
  <button class="sec" id="pCal" data-i18n="calibrate"></button>
  <label class="chk"><input type="checkbox" id="pEn"> <span data-i18n="dimQuiet"></span></label>
  <div id="pMotionBox">
    <label class="chk"><input type="checkbox" id="pMotion"> <span data-i18n="motionWake"></span></label>
    <div class="meter small" id="pMvMeter"><div class="fill" id="pMv"></div><div class="mark" id="pMvMark"></div></div>
    <div class="muted" id="pMvTxt">…</div>
    <label for="pMotionSens" data-i18n="pickSens"></label>
    <select id="pMotionSens">
      <option value="0.05" data-i18n="sensHigh"></option>
      <option value="0.1" data-i18n="sensNormal"></option>
      <option value="0.2" data-i18n="sensLow"></option>
    </select>
  </div>
  <label for="pPreset" data-i18n="timingPreset"></label>
  <select id="pPreset">
    <option value="testing" data-i18n="pTesting"></option>
    <option value="short" data-i18n="pShort"></option>
    <option value="normal" data-i18n="pNormal"></option>
    <option value="long" data-i18n="pLong"></option>
    <option value="custom" data-i18n="pCustom"></option>
  </select>
  <label for="pDim" data-i18n="dimAfter"></label>
  <div class="dur"><input id="pDim" inputmode="decimal"><select id="pDimU"><option>s</option><option>min</option><option>h</option></select></div>
  <label for="pOffT" data-i18n="offAfter"></label>
  <div class="dur"><input id="pOffT" inputmode="decimal"><select id="pOffTU"><option>s</option><option>min</option><option>h</option></select></div>
  <div class="row">
    <div><label for="pWakeS" data-i18n="wakeAfter"></label><input id="pWakeS" inputmode="decimal"></div>
    <div><label for="pMargin" data-i18n="sensDb"></label><input id="pMargin" inputmode="decimal"></div>
  </div>
  <div class="row">
    <div><label for="pBr" data-i18n="bright"></label><input id="pBr" inputmode="numeric"></div>
    <div><label for="pDimPct" data-i18n="dimmed"></label><input id="pDimPct" inputmode="numeric"></div>
  </div>
  <button id="pSave" data-i18n="saveScreen"></button>
  <div id="pmsg"></div>
</div>

<div class="card" id="wifiCard">
  <h2>Wi-Fi</h2>
  <div class="muted"><span data-i18n="connectedTo"></span><span id="curSsid">–</span></div>
  <button class="sec" id="scanBtn" data-i18n="scan"></button>
  <div id="nets"></div>
  <label for="ssid" data-i18n="netName"></label>
  <input id="ssid" autocomplete="off" data-i18n-ph="netPh">
  <label for="pass" data-i18n="password"></label>
  <div class="pw"><input id="pass" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="button" id="showPw" class="eye"></button></div>
  <details class="tip" id="pwTip">
    <summary data-i18n="pwTip"></summary>
    <ol data-i18n-html="pwTipList"></ol>
  </details>
  <button class="sec" id="saveWifi" data-i18n="saveWifi"></button>
  <div id="wmsg"></div>
</div>
<div class="card" id="fwCard">
  <h2 data-i18n="firmware"></h2>
  <div class="muted"><span data-i18n="installed"></span><b id="fwVer">–</b></div>
  <label for="fwChan" data-i18n="updatesLbl"></label>
  <select id="fwChan">
    <option value="stable" data-i18n="chStable"></option>
    <option value="beta" data-i18n="chBeta"></option>
  </select>
  <div id="fwState" class="muted" style="margin-top:8px">–</div>
  <div id="fwNotes" style="display:none;margin-top:8px"></div>
  <div class="meter" id="fwMeter" style="display:none"><div class="fill" id="fwBar"></div></div>
  <button class="sec" id="fwCheck" data-i18n="checkUpd"></button>
  <button id="fwInstall" style="display:none"></button>
  <div id="fwmsg"></div>
</div>

<script>

  fwIdle: 'Vérifie les mises à jour une minute après le démarrage, puis toutes les 6 heures.', fwChecking: 'Vérification…',
  fwUpToDate: 'À jour{0}.', fwLatest: ' (dernière : {0})', fwAvailable: 'La version {0} est disponible.',
  fwDownloading: "Téléchargement de {0}… {1} %. Laissez l'afficheur branché.", fwDone: "Installée. L'afficheur redémarre…",
  fwFailed: 'La vérification a échoué : {0}.', unknownErr: 'erreur inconnue', installX: 'Installer {0}',
  theUpdate: 'la mise à jour', installConfirm: "Installer {0}? L'afficheur redémarre ensuite; les réglages sont conservés.",
  noAnswer: "L'afficheur n'a pas répondu", whatsNew: 'Nouveautés', pageError: 'Erreur dans la page : {0} (ligne {1})',
 },
};
let LANG = 'en';
let fwLast = null;                                  // last /api/update answer (redrawn on a language change)
function t(k, ...a){
  const s = (I18N[LANG] && I18N[LANG][k]) ?? I18N.en[k] ?? k;
  return s.replace(/\{(\d)\}/g, (m, i) => a[i]);
}
const num = (x, d) => { const s = (+x).toFixed(d); return LANG === 'fr' ? s.replace('.', ',') : s; };   // 0,10 g
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  $('uLang').value = LANG;
  const pw = $('pass').type === 'password';
  $('showPw').textContent = t(pw ? 'show' : 'hide'); $('showPw').setAttribute('aria-label', t(pw ? 'showPw' : 'hidePw'));
  if (cfg) { showPlaces(); if (editing >= 0) $('edTitle').textContent = editing >= cfg.places.length ? t('newPlace') : t('editPlace', cfg.places[editing].name); }
  if (fwLast) { $('fwNotes').dataset.t = ''; fwShow(fwLast); }
}

function say(el, text, ok){ el.textContent = text; el.className = ok ? 'ok' : 'err'; }

async function saveUnits(){
  const body = {temp: $('uTemp').value, wind: $('uWind').value, clock: Number($('uClock').value)};
  try{
    const r = await fetch('/api/units', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    say($('umsg'), r.ok ? t('saved') : t('notSaved', r.status), r.ok);
  }catch(e){ say($('umsg'), t('noReach'), false); }
}
['uTemp', 'uWind', 'uClock'].forEach(id => $(id).addEventListener('change', saveUnits));
$('uLang').addEventListener('change', async () => {          // the display's language, and this page's
  LANG = $('uLang').value; applyLang();
  try{
    const r = await fetch('/api/units', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({lang: LANG})});
    say($('umsg'), r.ok ? t('saved') : t('notSaved', r.status), r.ok);
  }catch(e){ say($('umsg'), t('noReach'), false); }
});

/* ---------- Places: a list; tapping a place (or "Add a place") opens the editor with a map ---------- */
let cfg = null, editing = -1, nameTouched = false;   // editing: place index, places.length = a new one, -1 = list
function showPlaces(){
  const box = $('places'); box.innerHTML = '';
  cfg.places.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'pl';
    const n = document.createElement('div'); n.className = 'pn';
    const b = document.createElement('b'); b.textContent = p.name;
    const m = document.createElement('span'); m.className = 'muted'; m.textContent = p.lat.toFixed(4) + ', ' + p.lon.toFixed(4);
    n.append(b, m); d.append(n);
    if (i === cfg.active) { const o = document.createElement('span'); o.className = 'on'; o.textContent = t('onScreen'); d.append(o); }
    else {
      const s = document.createElement('button'); s.className = 'sec'; s.textContent = t('show');
      s.onclick = ev => { ev.stopPropagation(); placeAct({select: i}, t('showing', p.name)); };
      d.append(s);
    }
    const c = document.createElement('span'); c.className = 'chev'; c.textContent = '›'; d.append(c);
    d.onclick = () => openEditor(i);
    box.appendChild(d);
  });
  $('addPlace').style.display = cfg.places.length < cfg.max_places ? '' : 'none';
}
function setView(list){ $('placeList').style.display = list ? '' : 'none'; $('editor').style.display = list ? 'none' : ''; }
function openEditor(i){
  editing = i;
  const isNew = i >= cfg.places.length, p = isNew ? cfg.places[cfg.active] : cfg.places[i];
  $('edTitle').textContent = isNew ? t('newPlace') : t('editPlace', p.name);
  $('name').value = isNew ? '' : p.name; nameTouched = !isNew;
  $('q').value = ''; $('results').innerHTML = '';
  $('delPlace').style.display = !isNew && cfg.places.length > 1 ? '' : 'none';
  $('msg').textContent = '';
  setView(false);
  setPos(p.lat, p.lon, false);
  showMap(p.lat, p.lon, isNew ? 8 : 11);
}
function closeEditor(){ editing = -1; setView(true); }
function setPos(lat, lon, picked){                 // picked: chosen on the map or by GPS -> suggest a name
  $('lat').value = lat.toFixed(4); $('lon').value = lon.toFixed(4);
  if (pin) pin.setLatLng([lat, lon]);
  if (picked && !nameTouched) nameFor(lat, lon).then(n => { if (!nameTouched) $('name').value = n; });
}
$('name').oninput = () => { nameTouched = $('name').value.trim() !== ''; };
['lat', 'lon'].forEach(id => $(id).addEventListener('input', () => {
  const lat = parseFloat($('lat').value), lon = parseFloat($('lon').value);
  if (isFinite(lat) && isFinite(lon) && pin) { pin.setLatLng([lat, lon]); map.panTo([lat, lon]); }
}));

// Map: Leaflet + OpenStreetMap tiles, loaded the first time the editor opens (pinned version, integrity-checked).
// Needs internet on the phone; without it the coordinates are entered by hand.
const LEAFLET = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet';
let map = null, pin = null, leaflet = null;
function loadLeaflet(){
  if (!leaflet) leaflet = new Promise((ok, fail) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = LEAFLET + '.css'; css.crossOrigin = '';
    css.integrity = 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=';
    const js = document.createElement('script');
    js.src = LEAFLET + '.js'; js.crossOrigin = '';
    js.integrity = 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=';
    js.onload = () => ok(window.L);
    js.onerror = () => { leaflet = null; css.remove(); js.remove(); fail(); };
    document.head.append(css, js);
  });
  return leaflet;
}
const wrapLon = x => ((x + 540) % 360) - 180;
async function showMap(lat, lon, zoom){
  $('mapNote').textContent = t('mapHelp');
  $('map').style.display = '';
  try{
    const L = await loadLeaflet();
    if (!map){
      map = L.map('map');
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                  {maxZoom: 18, attribution: '© OpenStreetMap contributors'}).addTo(map);
      pin = L.marker([lat, lon], {draggable: true}).addTo(map);
      pin.on('dragend', () => { const ll = pin.getLatLng(); setPos(ll.lat, wrapLon(ll.lng), true); });
      map.on('click', e => setPos(e.latlng.lat, wrapLon(e.latlng.lng), true));
    }
    map.invalidateSize();
    map.setView([lat, lon], zoom);
    pin.setLatLng([lat, lon]);
  }catch(e){
    $('map').style.display = 'none';
    $('mapNote').textContent = t('mapNoNet');
    $('coords').open = true;
  }
}
async function placeAct(body, done){
  try{
    const r = await fetch('/api/places', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw 0;
    closeEditor(); say($('msg'), done, true); load();
  }catch(e){ say($('msg'), t('failed'), false); }
}
$('addPlace').onclick = () => openEditor(cfg.places.length);
$('cancelEd').onclick = () => { closeEditor(); $('msg').textContent = ''; };
$('delPlace').onclick = () => {
  const p = cfg.places[editing];
  if (confirm(t('delConfirm', p.name))) placeAct({delete: editing}, t('deleted', p.name));
};

async function load(){
  try{
    const c = await (await fetch('/api/config')).json();
    cfg = c;
    if (c.languages) $('uLang').replaceChildren(...c.languages.map(l => new Option(l.name, l.code)));
    if (c.units && c.units.lang && c.units.lang !== LANG) { LANG = c.units.lang; applyLang(); }
    showPlaces();
    $('curSsid').textContent = c.ssid || '–';
    if (c.units) { $('uTemp').value = c.units.temp; $('uWind').value = c.units.wind; $('uClock').value = String(c.units.clock); }
  }catch(e){ say($('msg'), t('cantRead'), false); }
}
function bars(rssi){ return rssi >= -55 ? '▂▄▆█' : rssi >= -67 ? '▂▄▆' : rssi >= -78 ? '▂▄' : '▂'; }
async function scan(){
  const btn = $('scanBtn');
  btn.disabled = true; btn.textContent = t('scanning');
  $('nets').innerHTML = '';
  try{
    const nets = await (await fetch('/api/scan')).json();
    if (!nets.length) { const d = document.createElement('div'); d.className = 'muted'; d.textContent = t('noNets'); $('nets').appendChild(d); }
    nets.forEach(n => {
      const d = document.createElement('div');
      const name = document.createElement('span'); name.textContent = n.ssid;
      const sig = document.createElement('span'); sig.className = 'sig'; sig.textContent = (n.secure ? '🔒 ' : '') + bars(n.rssi);
      d.append(name, sig);
      d.onclick = () => {
        document.querySelectorAll('#nets div').forEach(x => x.classList.remove('sel'));
        d.classList.add('sel');
        $('ssid').value = n.ssid;
        if (n.secure) { $('pass').value = ''; $('pass').focus(); say($('wmsg'), t('enterPw', n.ssid), true); }
        else { $('pass').value = ''; say($('wmsg'), t('openNet', n.ssid), true); }
      };
      $('nets').appendChild(d);
    });
  }catch(e){ say($('wmsg'), t('scanFail'), false); }
  btn.disabled = false; btn.textContent = t('scanAgain');
}
$('scanBtn').onclick = scan;
$('showPw').onclick = () => {
  const p = $('pass'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('showPw').textContent = t(show ? 'hide' : 'show');
  $('showPw').setAttribute('aria-label', t(show ? 'hidePw' : 'showPw'));
  p.focus();
};

async function nameFor(lat, lon){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=10&accept-language=${LANG}&lat=${lat}&lon=${lon}`);
    const j = await r.json(); const a = j.address || {};
    return a.city || a.town || a.village || a.municipality || a.county || t('myLocation');
  }catch(e){ return t('myLocation'); }
}

$('gps').onclick = () => {
  if (!window.isSecureContext || !navigator.geolocation){ say($('msg'), t('needSecure'), false); return; }
  say($('msg'), t('gettingLoc'), true);
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = p.coords.latitude, lon = p.coords.longitude;
    setPos(lat, lon, true);
    if (map) map.setView([lat, lon], 13);
    say($('msg'), t('gotIt'), true);
  }, err => say($('msg'), t('locUnavail', err.message), false), {enableHighAccuracy:false, timeout:15000});
};

let searchTimer;
$('q').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('q').value.trim();
  if (q.length < 2){ $('results').innerHTML=''; return; }
  searchTimer = setTimeout(async () => {
    try{
      const j = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=' + LANG + '&name='+encodeURIComponent(q))).json();
      $('results').innerHTML = '';
      (j.results||[]).forEach(r => {
        const d = document.createElement('div');
        d.textContent = [r.name, r.admin1, r.country].filter(Boolean).join(', ');
        d.onclick = () => { setPos(r.latitude, r.longitude, false);
                            if (map) map.setView([r.latitude, r.longitude], 11);
                            if (!nameTouched) { $('name').value = r.name; }
                            $('results').innerHTML=''; $('q').value='';
                            say($('msg'), t('cityPicked', r.name), true); };
        $('results').appendChild(d);
      });
    }catch(e){ say($('msg'), t('searchNoNet'), false); }
  }, 350);
};

async function savePlace(){
  const index = editing, isNew = index >= cfg.places.length;
  const body = {name: $('name').value.trim() || t('myPlace'), lat: parseFloat($('lat').value), lon: parseFloat($('lon').value), index};
  if (!isFinite(body.lat) || !isFinite(body.lon) || Math.abs(body.lat) > 85 || Math.abs(body.lon) > 180){
    say($('msg'), t('badCoords'), false); $('coords').open = true; return;
  }
  try{
    const r = await fetch('/api/location', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw 0;
    closeEditor();
    say($('msg'), index === cfg.active ? t('savedUpdating') : t(isNew ? 'addedPlace' : 'savedPlace', body.name), true);
    load();
  }catch(e){ say($('msg'), t('saveFailed'), false); }
}
$('saveLoc').onclick = savePlace;

$('saveWifi').onclick = async () => {
  const body = {ssid: $('ssid').value, pass: $('pass').value};
  if (!body.ssid){ say($('wmsg'), t('chooseNet'), false); return; }
  try{
    await fetch('/api/wifi', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    say($('wmsg'), t('wifiSaved'), true);
  }catch(e){ say($('wmsg'), t('saveFailed'), false); }
};

// ---- Screen & presence ----
let presLoaded = false;
const PRESETS = {                                     // seconds; off = total quiet time before the screen goes dark
  testing: {dim: 10,   off: 30,    wake: 2},
  short:   {dim: 120,  off: 900,   wake: 2},
  normal:  {dim: 600,  off: 3600,  wake: 3},
  long:    {dim: 1800, off: 10800, wake: 3},
};
const UNIT = {s: 1, min: 60, h: 3600};
function setDur(id, secs){                            // show in the largest unit that gives a round-ish number
  const u = secs >= 3600 && secs % 1800 === 0 ? 'h' : secs >= 60 && secs % 30 === 0 ? 'min' : 's';
  $(id).value = +(secs / UNIT[u]).toFixed(2); $(id + 'U').value = u;
}
const getDur = id => (+$(id).value) * UNIT[$(id + 'U').value];
function matchPreset(dim, off, wake){
  for (const [k, p] of Object.entries(PRESETS)) if (p.dim === dim && p.off === off && p.wake === wake) return k;
  return 'custom';
}
const pct = db => Math.max(0, Math.min(100, (db + 90) / 90 * 100));      // -90..0 dBFS -> 0..100 %
async function pollPresence(){
  try{
    const p = await (await fetch('/api/presence')).json();
    const names = {active: t('stActive'), dim: t('stDim'), off: t('stOff')};
    $('pState').textContent = p.calibrating ? t('calibrating', Math.ceil(p.calib_left_s)) : (p.mic_ok ? names[p.state] : t('noMic'));
    $('pState').className = 'st ' + (p.calibrating ? '' : p.state);
    $('pBright').textContent = t('brightNow', p.brightness);
    $('pFill').style.width = pct(p.level_db) + '%';
    $('pFill').style.background = p.level_db > p.threshold_db ? '#ffb347' : 'var(--acc)';
    $('pMark').style.left = pct(p.threshold_db) + '%';
    $('pLevel').textContent = t('soundLine', p.level_db.toFixed(0), p.threshold_db.toFixed(0), p.baseline_db.toFixed(0), p.margin_db.toFixed(0));
    $('pWake').style.width = Math.round(p.wake_progress * 100) + '%';
    const fmt = x => x >= 3600 ? num(x / 3600, 1) + ' h' : x >= 60 ? num(x / 60, 1) + ' min' : num(x, 0) + ' s';
    $('pWakeTxt').textContent = p.state === 'active' ? t('quietFor', fmt(p.quiet_s), fmt(p.dim_s))
                                                     : t('wakeProg', Math.round(p.wake_progress * 100), num(p.wake_s, 0));
    $('pCal').disabled = p.calibrating;
    $('pMotionBox').style.display = p.imu_ok === false ? 'none' : '';      // no motion sensor: no options
    if (p.imu_ok) {                                                         // movement meter, 0..0.4 g
      const mv = x => Math.min(100, x / 0.4 * 100);
      $('pMv').style.width = mv(p.motion_g) + '%';
      $('pMv').style.background = p.motion_g > p.motion_thr ? '#ffb347' : '#6fd08c';
      $('pMvMark').style.left = mv(p.motion_thr) + '%';
      $('pMvTxt').textContent = t('movement', num(p.motion_g, 2), num(p.motion_thr, 2));
    }
    if (!presLoaded) {
      presLoaded = true;
      $('pEn').checked = p.enabled; $('pMargin').value = p.margin_db; $('pWakeS').value = p.wake_s;
      $('pMotion').checked = !!p.motion_wake;
      $('pMotionSens').value = String(p.motion_thr <= 0.07 ? 0.05 : p.motion_thr >= 0.15 ? 0.2 : 0.1);
      setDur('pDim', p.dim_s); setDur('pOffT', p.dim_s + p.off_s);
      $('pBr').value = p.bright_pct; $('pDimPct').value = p.dim_pct;
      $('pPreset').value = matchPreset(p.dim_s, p.dim_s + p.off_s, p.wake_s);
    }
  }catch(e){}
}
$('pCal').onclick = async () => {
  try{
    const r = await fetch('/api/calibrate', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({seconds:5})});
    say($('pmsg'), r.ok ? t('calStart') : t('calNA'), r.ok);
  }catch(e){ say($('pmsg'), t('calFail'), false); }
};
$('pSave').onclick = async () => {
  const dim = getDur('pDim'), offTotal = getDur('pOffT');
  if (!(dim > 0) || !(offTotal > dim)) { say($('pmsg'), t('offLonger'), false); return; }
  const body = {enabled: $('pEn').checked, motion_wake: $('pMotion').checked, motion_thr: +$('pMotionSens').value, margin_db: +$('pMargin').value, wake_s: +$('pWakeS').value,
                dim_s: dim, off_s: offTotal - dim, bright_pct: +$('pBr').value, dim_pct: +$('pDimPct').value};
  try{
    const r = await fetch('/api/presence', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if (!r.ok) throw 0;
    presLoaded = false; say($('pmsg'), t('savedDot'), true);
  }catch(e){ say($('pmsg'), t('saveFailed'), false); }
};
$('pPreset').onchange = () => {
  const p = PRESETS[$('pPreset').value];
  if (!p) return;
  setDur('pDim', p.dim); setDur('pOffT', p.off); $('pWakeS').value = p.wake;
  say($('pmsg'), t('presetFilled'), true);
};
applyLang();
['pDim', 'pDimU', 'pOffT', 'pOffTU', 'pWakeS'].forEach(id => $(id).addEventListener('input', () => { $('pPreset').value = 'custom'; }));
setInterval(() => { if (!document.hidden) pollPresence(); }, 700);
pollPresence();

// Setup network / plain-HTTP page: Wi-Fi first, and point to the secure page for GPS
if (!window.isSecureContext) {
  const url = 'https://' + location.host + '/';
  $('secureLink').textContent = url; $('secureLink').href = url;
  $('gpsNote').style.display = 'block';
}
if (location.hostname === '192.168.4.1') { document.body.insertBefore($('wifiCard'), $('locCard')); setTimeout(scan, 300); }
// Firmware updates
let fwPoll = null;
function fwShow(u){
  fwLast = u;
  $('fwVer').textContent = u.current || '–';
  $('fwChan').value = u.channel || 'stable';
  const busy = u.state === 'checking' || u.state === 'downloading' || u.state === 'done';
  const txt = {
    idle: t('fwIdle'),
    checking: t('fwChecking'),
    up_to_date: t('fwUpToDate', u.latest ? t('fwLatest', u.latest) : ''),
    available: t('fwAvailable', u.latest),
    downloading: t('fwDownloading', u.latest, u.progress),
    done: t('fwDone'),
    failed: t('fwFailed', u.error || t('unknownErr'))
  }[u.state] || u.state;
  $('fwState').textContent = txt;
  fwNotes(u.state === 'available' ? u.notes : '');
  $('fwMeter').style.display = u.state === 'downloading' || u.state === 'done' ? 'block' : 'none';
  $('fwBar').style.width = (u.state === 'done' ? 100 : u.progress) + '%';
  $('fwInstall').style.display = u.state === 'available' ? 'block' : 'none';
  $('fwInstall').textContent = t('installX', u.latest || t('theUpdate'));
  $('fwCheck').disabled = busy;
  if (busy && !fwPoll) fwPoll = setInterval(fwLoad, 1500);
  if (!busy && fwPoll) { clearInterval(fwPoll); fwPoll = null; }
}
// "vX|Month D, YYYY" header lines, one line per change, blank line between releases
function fwNotes(t){
  const box = $('fwNotes');
  box.style.display = t ? 'block' : 'none';
  if (!t || box.dataset.t === t) return;
  box.dataset.t = t;
  box.replaceChildren();
  const h = document.createElement('div'); h.textContent = t('whatsNew'); h.style.fontWeight = '600'; box.append(h);
  let ul = null;
  for (const line of t.split('\n')) {
    if (!line) { ul = null; continue; }
    const m = line.match(/^(v\S+)\|(.*)$/);
    if (m) {
      const d = document.createElement('div');
      d.className = 'muted'; d.style.marginTop = '6px';
      d.textContent = m[1] + (m[2] ? ' · ' + m[2] : '');
      box.append(d); ul = null; continue;
    }
    if (!ul) { ul = document.createElement('ul'); ul.style.margin = '4px 0 0'; ul.style.paddingLeft = '20px'; box.append(ul); }
    const li = document.createElement('li'); li.textContent = line; ul.append(li);
  }
}
async function fwLoad(){ try { fwShow(await (await fetch('/api/update')).json()); } catch(e) {} }
async function fwPost(body){
  try { fwShow(await (await fetch('/api/update', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})).json()); }
  catch(e){ say($('fwmsg'), t('noAnswer'), false); }
}
$('fwCheck').onclick = () => fwPost({action:'check'});
$('fwInstall').onclick = () => { if (confirm(t('installConfirm', fwLast && fwLast.latest || t('theUpdate')))) fwPost({action:'install'}); };
$('fwChan').onchange = () => fwPost({channel: $('fwChan').value});
fwLoad();
load();
say($('msg'), '', true);
</script>
