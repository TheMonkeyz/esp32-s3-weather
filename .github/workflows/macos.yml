# The project's Mac setup, tested on GitHub's macOS runners (no one on the team has a Mac): tools/mac/setup.sh on a
# fresh machine, then everything a designer does on her MacBook except the board itself: the firmware build
# (build/v55, as docs/MACOS.md says), the host unit tests with Apple's clang, the harness's unit tests (the
# flash helper against a loopback port), the settings-page tests and the emulator. Releases don't depend on it.
#
# Runs on pushes to any branch but main (a design branch is checked on a Mac at every push) and by hand.
name: macOS

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15                 # Apple Silicon, like a recent MacBook
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0              # tags, for the version label

      - name: Setup script (tools/mac/setup.sh)
        run: bash tools/mac/setup.sh

      - name: Firmware build (docs/MACOS.md, "Build")
        run: |
          . "$HOME/esp/esp-idf-v5.5.4/export.sh"
          idf.py -B build/v55 -D SDKCONFIG=build/v55/sdkconfig build
          ls -l build/v55/weather_amoled.bin

      - name: Host unit tests (Apple clang, AddressSanitizer)
        run: |
          . "$HOME/esp/esp-idf-v5.5.4/export.sh"
          make -C tests/host

      - name: Harness unit tests + flash helper (loopback port, ESP-IDF's Python)
        run: |
          . "$HOME/esp/esp-idf-v5.5.4/export.sh"
          python -m unittest discover -s tools/harness -p "test_*.py" -v
          python tools/flash_helper.py ports
          python tools/flash_helper.py stage build/v55
          python tools/harness/harness.py --help > /dev/null

      - name: Settings page tests (Playwright)
        working-directory: tools/webtest
        run: npm test

      - name: Emulator (Emscripten, LVGL from the firmware build)
        run: |
          . "$HOME/esp/esp-idf-v5.5.4/export.sh" > /dev/null
          source "$HOME/emsdk/emsdk_env.sh"
          make -C web/emu -j4
          ls -l web/emu/build/emu.wasm

      - name: Doctor (informational: no board, no GitHub sign-in here)
        if: always()
        run: bash tools/mac/doctor.sh || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: macos-webtest-shots
          path: tools/webtest/shots/
